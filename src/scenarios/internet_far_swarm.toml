# Every pair is far apart: 200 to 300 ms RTT with 10 ms of jitter, and no nearby
# parent to prefer. At t = 40 s a fifth of the relays die. Probe, NEIGHBOR and
# eviction deadlines sized for a LAN fail here.
seed = 21
duration_s = 90.0
forest_size = 3

[publisher]
upload_kbps = 50000

[[viewers]]
label = "relays"
count = 45
class = "relay"
upload_kbps = { min = 8000.0, max = 20000.0 }
top_layer = 2
join_s = { min = 1.0, max = 15.0 }

[[viewers]]
label = "leaves"
count = 15
class = "leaf"
upload_kbps = { min = 1000.0, max = 3000.0 }
top_layer = 1
join_s = { min = 5.0, max = 18.0 }

[[events]]
kind = "kill_fraction"
at_s = 40.0
fraction = 0.2
class = "relay"

[network]
regions = 1
intra_region_rtt_ms = { min = 200.0, max = 300.0 }
jitter_ms = 10.0

[kpis]
psr_max = 0.02
# Over eight seeds the join mean is 5.1 to 5.2 s and the repair p95 moves between
# 2 s and 10 s (scripts/sim_seeds.sh). The limits leave room for that spread.
sjl_mean_max_s = 6.0
sjl_p95_max_s = 9.0
active_fraction_min = 0.95
repair_median_max_s = 2.0
repair_p95_max_s = 10.0
