# Ch6 §6.1 and App D §D.4.14. Half the relays sit behind cone NATs: a joiner can only
# reach them after the referrer that named them forwards a PUNCH_REQUEST and the target
# opens its mapping with a PING. Every viewer must still attach and play.
seed = 5
duration_s = 90.0
forest_size = 3

[publisher]
upload_kbps = 30000

[[viewers]]
label = "public"
count = 20
class = "relay"
upload_kbps = { min = 10000.0, max = 20000.0 }
top_layer = 2
join_s = { min = 1.0, max = 20.0 }

[[viewers]]
label = "cone"
count = 20
class = "relay"
upload_kbps = { min = 10000.0, max = 20000.0 }
top_layer = 2
join_s = { min = 1.0, max = 20.0 }
nat = "cone"

[network]
regions = 2

[kpis]
psr_max = 0.02
sjl_mean_max_s = 5.0
sjl_p95_max_s = 9.0
active_fraction_min = 0.95
repair_median_max_s = 3.0
repair_p95_max_s = 6.0

[kpis.facts_min]
punches_sent = 10
"active_fraction:cone" = 0.95
"active_fraction:public" = 0.95
