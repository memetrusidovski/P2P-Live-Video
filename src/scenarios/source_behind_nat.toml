# Ch6 §6.3.3. The broadcaster sits behind a symmetric NAT and cannot be reached: it binds
# two public 40 Mbps relays as ingress relays, pushes every slice to them, and the swarm
# joins through them as if they were the source.
seed = 13
duration_s = 90.0
forest_size = 3

[params]
relay_capable_uptime = 3000000

# The source starts after the first public relay, which seeds the DHT in its place.
# 30 Mbps holds two children in the 3.0 Mbps tree: two ingress relays (Ch6 §6.3.3).
[publisher]
upload_kbps = 30000
nat = "symmetric"
start_s = 5.0

[[viewers]]
label = "ingress"
count = 3
class = "relay"
upload_kbps = { min = 40000.0, max = 50000.0 }
top_layer = 2
join_s = { min = 1.0, max = 3.0 }

[[viewers]]
label = "viewers"
count = 30
class = "relay"
upload_kbps = { min = 10000.0, max = 20000.0 }
top_layer = 2
join_s = { min = 8.0, max = 25.0 }

[network]
regions = 2

[kpis]
psr_max = 0.02
sjl_mean_max_s = 6.0
sjl_p95_max_s = 10.0
active_fraction_min = 0.95
repair_median_max_s = 3.0
repair_p95_max_s = 6.0

[kpis.facts_min]
ingress_bound = 2
"active_fraction:viewers" = 0.95
