# ISSUE-089. With this seed 8 of the 45 relays rank tree 1 first, so the base layer
# has 58 slots for 60 viewers. Relays whose second-ranked tree is tree 1 must take it
# under the balance grant, or a third of the joins take over 15 s.
seed = 27
duration_s = 90.0
forest_size = 3

[publisher]
upload_kbps = 50000

[[viewers]]
label = "relays"
count = 45
class = "relay"
upload_kbps = { min = 8000.0, max = 20000.0 }
top_layer = 2
join_s = { min = 1.0, max = 15.0 }

[[viewers]]
label = "leaves"
count = 15
class = "leaf"
upload_kbps = { min = 1000.0, max = 3000.0 }
top_layer = 1
join_s = { min = 5.0, max = 18.0 }

[network]
regions = 3
intra_region_rtt_ms = { min = 20.0, max = 40.0 }
inter_region_rtt_ms = { min = 60.0, max = 100.0 }
jitter_ms = 5.0

[kpis]
psr_max = 0.004
# Without the grant the join mean is 7.3 s and the p95 is over 15 s.
sjl_mean_max_s = 6.5
sjl_p95_max_s = 14.0
active_fraction_min = 0.95
repair_median_max_s = 2.0
repair_p95_max_s = 10.0

[kpis.facts_min]
balance_grants = 3
