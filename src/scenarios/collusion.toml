# Ch5 §5.3.1 and §5.3.3. Six relays in three pairs sign receipts for each other every
# segment without sending a byte, so their rank proofs carry symmetric same-tree
# pairs. Honest parents that verify both partners' proofs must accuse, the
# accusations must spread over gossip, and three ranked accusers from three
# prefixes must evict the colluders. No honest node may be evicted.
seed = 29
duration_s = 240.0
forest_size = 3

# A small publisher keeps most viewers under relays, so honest relays serve several
# children each and hold the accuser standing of Ch5 §5.3.3 (rank 0.25).
[publisher]
upload_kbps = 25000

[[viewers]]
label = "honest"
count = 50
class = "relay"
upload_kbps = { min = 12000.0, max = 25000.0 }
top_layer = 2
join_s = { min = 1.0, max = 30.0 }

# Colluders pump rank without serving: little real upload, so most of a colluder's
# receipt list is forged and a sampled proof exposes it. Every 10 s a colluder drops one
# parent and re-joins to spend the rank (bs-sim `collude`), which is what presents its
# proofs to new auditors.
[[viewers]]
label = "colluders"
count = 6
class = "relay"
upload_kbps = { min = 2000.0, max = 4000.0 }
top_layer = 2
join_s = { min = 5.0, max = 20.0 }
behaviour = "collude"

[network]
regions = 2

[kpis]
psr_max = 0.05
# A 25 Mbps publisher and 56 viewers over 30 s: the join tail waits for relay slots.
sjl_mean_max_s = 4.0
sjl_p95_max_s = 6.5
# Evicted colluders leave the swarm; the honest fraction is gated below.
active_fraction_min = 0.85
repair_median_max_s = 3.0
repair_p95_max_s = 5.0

[kpis.facts_min]
accusations_made = 3
"consensus_evictions:colluders" = 3
"active_fraction:honest" = 0.9

[kpis.facts_max]
"consensus_evictions:honest" = 0
"psr:honest" = 0.01
