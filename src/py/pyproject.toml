[project]
name = "bitstream-tools"
version = "0.1.0"
description = "Independent wire decoder, report summariser and analysis helpers for the BitStream reference implementation"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
analysis = ["pandas>=2.0", "matplotlib>=3.7"]

[project.scripts]
bs-report = "bitstream_tools.report:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bitstream_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
