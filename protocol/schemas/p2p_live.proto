syntax = "proto3";

// ============================================================================
// NON-NORMATIVE LOGICAL FIELD REFERENCE
//
// This schema documents message *field semantics* only. The canonical wire
// encoding is the binary frame layouts defined in the protocol chapters and
// indexed by Appendix D (appendix_d_frame_registry.md): a 4-byte header
// (Version u8 | Type u8 | PayloadLength u16) followed by the typed payload,
// carried over plain UDP (pre-session DHT frames) or QUIC streams/datagrams.
// There is no gRPC/HTTP2 transport in this protocol; DHT RPCs are plain-UDP
// frames because they precede any QUIC session.
//
// STATUS (2026-09): this schema LAGS Appendix D. The resolution of ISSUE-019..039
// changed or added the following frames, none of which are reflected here yet:
// PeerRecord, REGISTER_PEER, GET_PEERS, STORE_RECORD/STORE_RECORD_ACK (0x1A/0x1B),
// Stream Record layout, ROSTER (0x18), RANK_PROOF (0x19), PUNCH_REQUEST (0x1C),
// MANIFEST_REQUEST (0x1D), MANIFEST/MANIFEST_UPDATE (chunk fields, slicing matrix),
// PROOF_OF_UPLOAD (per-segment bitmap), REPUTATION_AUDIT_GOSSIP (evidence), PULL_REQUEST
// (Flags), BLOCK_PROOF (SenderHopDepth), PROBE_RESPONSE (Flags/AssignedTrees),
// SHUFFLE, GOSSIP_EXCHANGE, FORWARD_JOIN, DISCONNECT (reason 0x04). Regenerate from
// the registry before relying on any message below. Appendix D is normative; this is not.
//
// Protocol version lives in the frame header — messages do not repeat it.
// ============================================================================

package p2p.live.v1;

option go_package = "p2p/live/v1;livev1";
option java_multiple_files = true;
option java_package = "com.p2p.live.v1";

// Chapter 2: Peer Discovery and Stream Registration (S/Kademlia, plain UDP)

// S/Kademlia ID Validation Block (152 bytes on the wire, Appendix D / Ch2 2.2.3).
// Carried only on pre-session plain-UDP frames; post-handshake frames ride
// authenticated QUIC and do not repeat it. The dynamic PoW is verified against
// the OBSERVED UDP source address — the peer never self-declares its IP.
message SKademliaIdentity {
  bytes node_id = 1;          // 32-byte secure node ID
  bytes public_key = 2;       // 32-byte Ed25519 node public key
  uint64 static_nonce = 3;    // Static proof-of-work nonce (C1)
  uint64 dynamic_nonce = 4;   // Dynamic proof-of-work nonce bound to observed IP
                              // (C2 is adaptive; verifiers check against the tier
                              //  required for the observed swarm size — Ch2 2.2)
  uint64 timestamp = 5;       // Microsecond timestamp to prevent replays
  bytes signature = 6;        // 64-byte Ed25519 signature of the header fields
}

message RegisterPeerRequest {          // Frame 0x0A
  bytes stream_id = 1;                 // 32-byte stream key (hash of publisher's pubkey)
  SKademliaIdentity identity = 2;      // Identity proofs of the registering node
  uint32 port = 3;                     // Listening UDP port
  uint32 protocol_type = 4;            // Protocol code (1 = UDP/QUIC)
  repeated uint32 assigned_trees = 5;  // Trees this node relays (multi-tree super nodes, Ch1 1.2 1.3)
}

message RegisterPeerResponse {
  uint32 status_code = 1;    // Standard status code (e.g., 200 OK, 400 Bad Proof)
  string message = 2;        // Status description
}

message GetPeersRequest {              // Frame 0x0B
  bytes stream_id = 1;                 // Target stream key
  SKademliaIdentity requester = 2;     // Identity of the node querying the list
  uint32 tree_id = 3;                  // Optional: restrict to relays of one tree (0 = any)
}

message GetPeersResponse {
  uint32 status_code = 1;
  repeated PeerAddress peers = 2;      // Compact list of active peers returned
  StreamRecord stream_record = 3;      // Publisher's current signed stream record (live-edge anchor)
}

message PeerAddress {
  bytes ip_address = 1;      // 4-byte IPv4 or 16-byte IPv6
  uint32 port = 2;           // Active UDP port
  bytes node_id = 3;         // S/Kademlia NodeID of target peer
}

// Publisher-signed authoritative record stored at K_s = Blake3(StreamID).
// Re-signed and republished by the broadcaster every 1.0s (once per segment)
// so live_edge_segment_id is never more than one segment stale.
message StreamRecord {
  bytes stream_id = 1;               // 32-byte Blake3(publisher public key)
  bytes publisher_pubkey = 2;        // 32-byte Ed25519 publisher key
  uint32 manifest_version = 3;       // Monotonic; peers reject non-increasing versions
  uint32 slicing_mode = 4;           // e.g. 1 = SVC_SPATIAL, 2 = MDC
  uint32 num_trees = 5;              // Current dynamic forest size M (1..6)
  uint32 swarm_size = 6;             // Publisher's current registered-peer count
  uint32 live_edge_segment_id = 7;   // Newest segment sequence number
  bytes live_edge_manifest_hash = 8; // 32-byte Blake3 Merkle root of that segment
  uint64 live_edge_timestamp = 9;    // Microsecond UTC creation time (staleness checks only)
  repeated TreeMapping tree_mapping = 10;
  bytes publisher_signature = 11;    // 64-byte Ed25519 signature over fields 1-10
}

message TreeMapping {
  uint32 tree_id = 1;
  uint32 layer = 2;                  // 0 = BASE, 1 = ENHANCE_1, 2 = ENHANCE_2, ...
  string resolution = 3;             // e.g. "480p"
  uint32 priority = 4;
}

// Parent-selection capacity probe (Frames 0x0E / 0x0F, Appendix D 4.7)
message ProbeRequest {
  bytes stream_id = 1;
  uint32 tree_id = 2;
}

message ProbeResponse {
  bytes node_id = 1;
  uint32 k_avail = 2;                // Remaining upload slots (0 during warm-up, Ch1 1.2 2.1)
  uint32 reliability = 3;            // Fixed-point on-time delivery ratio (/65535)
  uint32 hop_count = 4;              // Distance from source in the probed tree
  uint32 node_class = 5;             // 0 = RELAY, 1 = LEAF, 2 = LEAF_PRIVATE
  repeated uint32 assigned_trees = 6;
  uint32 live_edge_segment_seq = 7;
}

// Chapter 3: Overlay Membership and Epidemic Gossip (HyParView, QUIC control)

message GossipExchange {               // Frame 0x14
  uint32 sequence_number = 1;          // Monotonic replay counter (Ch3 3.2.2)
  bytes sender_node_id = 2;
  repeated PeerAddress neighbors = 3;
  bytes hmac_signature = 4;            // Blake3-HMAC with the DH-derived session key
}

message NeighborRequest {              // Frame 0x05
  bytes sender_node_id = 1;
  enum Priority {
    PRIORITY_UNSPECIFIED = 0;
    PRIORITY_HIGH = 1;                 // Active parent reconnection / RELAY_JOIN_REQUEST
    PRIORITY_LOW = 2;                  // Standard mesh expansion
  }
  Priority priority = 2;
  uint32 tree_id = 3;                  // 0 = membership only; m > 0 requests a slot in tree m
}

message Accepted {                     // Frame 0x08
  bytes sender_node_id = 1;
  uint32 accepted_type = 2;            // 0x03 = JOIN, 0x05 = NEIGHBOR
  uint32 tree_id = 3;
  uint32 hop_depth = 4;                // Acceptor's depth; joiner becomes hop_depth + 1
}

message DisconnectNotification {       // Frame 0x07
  bytes sender_node_id = 1;
  enum DisconnectReason {
    DISCONNECT_REASON_UNSPECIFIED = 0;
    DISCONNECT_REASON_CHOKE = 1;       // "DISCONNECT_CHOKE"
    DISCONNECT_REASON_QUIT = 2;
    DISCONNECT_REASON_EVICTION = 3;
  }
  DisconnectReason reason = 2;
}

message ShuffleRequest {               // Frame 0x06
  bytes original_sender_id = 1;
  uint32 ttl = 2;
  repeated PeerAddress nodes_to_shuffle = 3;
}

message ForwardJoin {                  // Frame 0x09
  bytes origin_node_id = 1;
  PeerAddress origin_address = 2;
  uint32 ttl = 3;
  uint32 pr_gossip = 4;
}

// Chapter 4: Media Distribution Frames

message Manifest {                     // Frames 0x11 (MANIFEST) / 0x17 (MANIFEST_UPDATE)
  bytes stream_id = 1;
  uint32 segment_sequence_number = 2;
  uint64 timestamp = 3;                // Microseconds
  bytes merkle_root = 4;               // 32-byte Blake3 root of the segment's block tree
  uint32 block_count = 5;
  uint32 segment_byte_length = 6;      // True length (last block is zero-padded to 16 KB)
  uint32 slicing_matrix_version = 7;   // MANIFEST_UPDATE: must strictly increase
  repeated TreeMapping tree_mapping = 8; // MANIFEST_UPDATE only
  bytes source_signature = 9;          // 64-byte Ed25519
}

message BlockTransmission {            // Frame 0x10 (pull path)
  uint32 segment_sequence_number = 1;
  uint32 block_index = 2;
  repeated bytes merkle_proof_path = 3; // Sibling hashes up to the signed root
  bytes block_payload = 4;              // 16 KB block data
}

message BlockProof {                   // Frame 0x13 (push path, precedes a block's symbols)
  uint32 segment_sequence_number = 1;
  uint32 block_index = 2;
  repeated bytes merkle_proof_path = 3;
}

// One RaptorQ source block per 16 KB Merkle block: K = 16 source symbols of
// 1024 bytes. source_block_number IS the Merkle block index within the
// segment; ESI < 16 = source symbol, ESI >= 16 = repair symbol. (Ch4 4.2)
message RaptorQSymbol {                // Frame 0x12 (QUIC datagram)
  uint32 segment_sequence_number = 1;
  uint32 source_block_number = 2;      // SBN = Merkle block index
  uint32 encoding_symbol_id = 3;       // ESI
  bytes symbol_payload = 4;            // Fixed 1024-byte payload
}

message BufferStateBitfield {          // Frame 0x15
  uint32 segment_sequence_number = 1;
  uint32 starting_block_index = 2;
  bytes bitfield_data = 3;             // Packed bitfield (optionally Bloom-compressed)
}

message PullRequest {                  // Frame 0x16
  uint32 segment_sequence_number = 1;
  uint32 block_index = 2;
  uint32 missing_symbol_count = 3;     // 0 = whole block; n > 0 = n repair symbols
  uint32 urgency_ms = 4;               // Requester's time to playout deadline
}

// Chapter 5: Economic Incentives & Reputation

message ProofOfUpload {                // Frame 0x20
  uint32 segment_sequence_number = 1;
  uint32 block_index = 2;
  bytes stream_id = 3;
  bytes uploader_node_id = 4;
  bytes downloader_node_id = 5;        // Signer identity — receipts are third-party auditable (Ch5 5.3)
  uint64 timestamp = 6;                // Microseconds
  bytes downloader_signature = 7;      // 64-byte Ed25519 from the receiver
}

message ChokeState {                   // Frame 0x21
  uint32 state = 1;                    // 0 = CHOKE, 1 = UNCHOKE, 2 = UNCHOKE_OPTIMISTIC
}

message ReputationAuditGossip {        // Frame 0x22
  bytes sender_node_id = 1;
  repeated SuspectRecord suspects = 2;
}

message SuspectRecord {
  bytes node_id = 1;
  float penalty_score = 2;             // Multiplier scoring deduction (0.0 to 1.0)
}

// Chapter 1/7: Stream lifecycle

message StreamEnd {                    // Frame 0x04
  bytes stream_id = 1;
  uint32 final_segment_sequence_number = 2;
  uint64 timestamp = 3;                // Microseconds
  bytes source_signature = 4;          // 64-byte Ed25519
}

// Chapter 6: NAT Traversal Relays

message RelayProposal {                // Frame 0x30
  bytes target_node_id = 1;
  uint32 target_port_number = 2;
}

message RelayBind {                    // Frame 0x31
  bytes client_a_id = 1;
  bytes client_b_id = 2;
}
